<!DOCTYPE html>
<html>
<head>
  <title>Registration Form</title>

  <style>
    /* ===== PAGE BACKGROUND ===== */
    body {
      background-color: #f0f4f8;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
    }

    /* ===== MAIN FORM BOX ===== */
    .form-box {
      background-color: #ffffff;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 30px;
      width: 550px;
    }

    /* ===== HEADING ===== */
    h1 {
      text-align: center;
      color: #2c3e50;
      margin-bottom: 5px;
    }

    p.subtitle {
      text-align: center;
      color: #888;
      font-size: 14px;
      margin-bottom: 25px;
    }

    /* ===== LABELS ===== */
    label.field-label {
      display: block;
      font-size: 13px;
      color: #555;
      margin-bottom: 5px;
      font-weight: bold;
    }

    /* ===== TEXT / PASSWORD INPUTS ===== */
    input[type="text"],
    input[type="password"],
    input[type="file"],
    select,
    textarea {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      margin-bottom: 15px;
      box-sizing: border-box;
      background-color: #fafafa;
    }

    /* ===== FOCUS EFFECT (jab click karo input pe) ===== */
    input[type="text"]:focus,
    input[type="password"]:focus,
    select:focus,
    textarea:focus {
      border-color: #3498db;
      outline: none;
      background-color: #fff;
    }

    /* ===== TWO COLUMN ROW ===== */
    .row-2 {
      display: flex;
      gap: 15px;
    }

    .row-2 > div {
      flex: 1;
    }

    /* ===== RADIO & CHECKBOX GROUP ===== */
    .radio-group,
    .checkbox-group {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      margin-bottom: 15px;
      padding-top: 4px;
    }

    .radio-group label,
    .checkbox-group label {
      font-size: 14px;
      color: #333;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    /* ===== HIDDEN FIELD INFO BOX ===== */
    .hidden-info {
      background-color: #eaf4fb;
      border: 1px solid #b3d9f0;
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 13px;
      color: #2980b9;
      margin-bottom: 18px;
    }

    /* ===== BUTTONS ===== */
    .btn-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    /* Submit button */
    .btn-submit {
      background-color: #2c3e50;
      color: white;
      border: none;
      padding: 10px 22px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
    }

    .btn-submit:hover {
      background-color: #1a252f;
    }

    /* Reset button */
    .btn-reset {
      background-color: #fff;
      color: #555;
      border: 1px solid #ccc;
      padding: 10px 22px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
    }

    .btn-reset:hover {
      background-color: #f0f0f0;
    }

    /* Draft button */
    .btn-draft {
      background-color: #fff;
      color: #3498db;
      border: 1px solid #3498db;
      padding: 10px 22px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
    }

    .btn-draft:hover {
      background-color: #eaf4fb;
    }

    /* ===== SUCCESS MESSAGE ===== */
    .success-msg {
      display: none;
      background-color: #d4edda;
      border: 1px solid #c3e6cb;
      color: #155724;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 14px;
      margin-bottom: 15px;
    }

    /* ===== LINKS SECTION ===== */
    .links-section {
      border-top: 1px solid #eee;
      padding-top: 15px;
      margin-top: 5px;
    }

    .links-section p {
      font-size: 13px;
      color: #888;
      margin: 0 0 8px;
    }

    .links-section a {
      font-size: 13px;
      color: #3498db;
      text-decoration: none;
      margin-right: 15px;
    }

    .links-section a:hover {
      text-decoration: underline;
    }

    /* Email link alag color */
    .links-section a.email-link {
      color: #e67e22;
    }

    /* New tab link alag color */
    .links-section a.new-tab-link {
      color: #e74c3c;
    }

  </style>

</head>
<body>

  <div class="form-box">

    <!-- HEADING -->
    <h1>Registration Form</h1>
    <p class="subtitle">Student Portal — BSCS 2026</p>

    <!-- FORM START -->
    <form action="submit.php" method="POST" enctype="multipart/form-data" onsubmit="handleSubmit(event)">

      <!-- NAME ROW (2 columns) -->
      <div class="row-2">
        <div>
          <label class="field-label">First Name</label>
          <input type="text" name="fname" placeholder="Ali" maxlength="50" />
        </div>
        <div>
          <label class="field-label">Last Name</label>
          <input type="text" name="lname" placeholder="Khan" maxlength="50" />
        </div>
      </div>

      <!-- EMAIL -->
      <label class="field-label">Email Address</label>
      <input type="text" name="email" placeholder="ali@example.com" />

      <!-- PASSWORD -->
      <label class="field-label">Password</label>
      <input type="password" name="pass" placeholder="Enter password" maxlength="30" />

      <!-- GENDER (Radio Buttons) -->
      <label class="field-label">Gender</label>
      <div class="radio-group">
        <label><input type="radio" name="gender" value="male" checked /> Male</label>
        <label><input type="radio" name="gender" value="female" /> Female</label>
        <label><input type="radio" name="gender" value="other" /> Other</label>
      </div>

      <!-- CITY (Dropdown) -->
      <label class="field-label">City</label>
      <select name="city">
        <option value="">-- Select City --</option>
        <option value="lhr" selected>Lahore</option>
        <option value="khi">Karachi</option>
        <option value="isb">Islamabad</option>
        <option value="psh">Peshawar</option>
      </select>

      <!-- SUBJECTS (Checkboxes) -->
      <label class="field-label">Subjects</label>
      <div class="checkbox-group">
        <label><input type="checkbox" name="math" value="on" checked /> Mathematics</label>
        <label><input type="checkbox" name="physics" value="on" /> Physics</label>
        <label><input type="checkbox" name="cs" value="on" /> Computer Science</label>
      </div>

      <!-- FILE UPLOAD -->
      <label class="field-label">Upload Document (CNIC / Degree)</label>
      <input type="file" name="doc" accept="image/*,.pdf" />

      <!-- TEXTAREA -->
      <label class="field-label">About Yourself</label>
      <textarea name="about" rows="4" placeholder="Tell us about yourself..."></textarea>

      <!-- HIDDEN FIELD (user ko nahi dikhta) -->
      <input type="hidden" name="form_id" value="REG-2026" />
      <div class="hidden-info">
        Hidden field: <strong>form_id = REG-2026</strong> — yeh user ko nahi dikhta lekin server ko bhej deta hai
      </div>

      <!-- SUCCESS MESSAGE (submit ke baad dikhega) -->
      <div class="success-msg" id="successMsg">
        Form submit ho gaya! (Real mein action="submit.php" pe data jaata)
      </div>

      <!-- BUTTONS -->
      <div class="btn-row">
        <button type="submit" class="btn-submit">Submit Form</button>
        <button type="reset" class="btn-reset">Reset</button>
        <button type="button" class="btn-draft" onclick="alert('Draft save ho gaya!')">Save Draft</button>
      </div>

    </form>
    <!-- FORM END -->

    <!-- LINKS SECTION -->
    <div class="links-section">
      <p>Useful Links:</p>

      <!-- Normal link (same tab) -->
      <a href="index.html" target="_self">Home</a>

      <!-- Normal link (same tab) -->
      <a href="login.html">Login</a>

      <!-- Link that opens in NEW TAB -->
      <a href="https://google.com" target="_blank" class="new-tab-link">Google (New Tab)</a>

      <!-- Email link -->
      <a href="mailto:support@uni.edu.pk" class="email-link">Email Support</a>

      <!-- Link to section on same page -->
      <a href="#top">Go to Top</a>
    </div>

  </div>

  <!-- JAVASCRIPT -->
  <script>
    function handleSubmit(event) {
      event.preventDefault(); // page reload rokta hai
      var msg = document.getElementById('successMsg');
      msg.style.display = 'block';
    }
  </script>

</body>
</html>
